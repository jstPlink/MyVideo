name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test backend
        run: |
          cd server
          npm ci
          npm test
      - name: Build web
        run: |
          cd web
          npm ci
          npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build immagine Docker (senza pubblicare)
        run: docker build -t myvideo:ci .
