name: Release

# Si attiva quando viene creato un tag di versione (vX.Y.Z): pubblica la release GitHub,
# l'immagine Docker (ghcr.io) e l'APK Android.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crea la release con le note del CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/release-notes.sh "$VERSION" > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release edit "$GITHUB_REF_NAME" --notes-file notes.md \
            || gh release create "$GITHUB_REF_NAME" --title "MyVideo $VERSION" --notes-file notes.md

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Versione e nome immagine
        id: v
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build installer
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npx electron-builder --publish never
      - name: Carica gli installer nella release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in desktop/dist/*.exe desktop/dist/*.dmg desktop/dist/*.AppImage; do
            if [ -f "$f" ]; then gh release upload "$GITHUB_REF_NAME" "$f" --clobber; fi
          done

  apk:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: "Android SDK (gia' presente sul runner, solo licenze e piattaforma)"
        run: |
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - name: Build web e sync Capacitor
        run: |
          cd web
          npm ci
          npm run build
          npx cap sync android
      - name: Keystore di firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 assente: APK firmato con chiave di debug"
          fi
      - name: Assembla APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export APP_VERSION="${GITHUB_REF_NAME#v}"
          cd web/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Carica l'APK nella release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp web/android/app/build/outputs/apk/release/app-release.apk "MyVideo-$VERSION.apk"
          gh release upload "$GITHUB_REF_NAME" "MyVideo-$VERSION.apk" --clobber
